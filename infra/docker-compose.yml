services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rfm
      POSTGRES_USER: rfm
      POSTGRES_PASSWORD: rfm
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rfm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfm -d rfm"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rfm_postgres_data:
