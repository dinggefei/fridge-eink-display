<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050">
  <defs>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #173b33; }
      .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52665f; }
      .section { font: 700 27px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #173b33; }
      .label { font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #243f39; }
      .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #52665f; }
      .tiny { font: 500 15px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; fill: #314b44; }
    </style>
    <pattern id="antennaHatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d8463d" stroke-width="3"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c13f35"/>
    </marker>
  </defs>

  <rect width="1500" height="1050" fill="#f5f3ed"/>
  <text x="55" y="62" class="title">V0.7 后盖混合磁铁布局示意</text>
  <text x="58" y="103" class="subtitle">1块 90×50×2 mm + 2块 50×20×2 mm｜背面视角，USB-C 在上｜暂不修改 STL</text>

  <rect x="45" y="140" width="900" height="750" rx="28" fill="#ffffff" stroke="#7fa596" stroke-width="4"/>
  <text x="78" y="187" class="section">按箭头调整：一块小磁铁移入中央空隙</text>
  <text x="78" y="220" class="small">大磁铁恢复水平居中；中央小磁铁在四个相邻器件之间取均衡位置，另一块仍竖放右上。</text>

  <!-- enclosure: 120 x 184 mm, scale 2.75 px/mm -->
  <rect x="300" y="255" width="330" height="506" rx="23" fill="#f8faf8" stroke="#173b33" stroke-width="5"/>
  <rect x="452" y="247" width="26" height="8" rx="3" fill="#173b33"/>
  <text x="487" y="252" class="tiny">USB-C</text>

  <!-- component envelopes -->
  <rect x="315" y="300" width="70" height="174" rx="8" fill="#dbe9f6" stroke="#35689b" stroke-width="3"/>
  <text x="350" y="390" text-anchor="middle" class="tiny">ESP32</text>
  <rect x="315" y="299" width="70" height="48" rx="5" fill="url(#antennaHatch)" stroke="#d8463d" stroke-width="2"/>
  <text x="350" y="287" text-anchor="middle" class="tiny" fill="#d8463d">Wi-Fi 天线避让</text>
  <rect x="439" y="267" width="70" height="112" rx="8" fill="#e8def4" stroke="#7654a3" stroke-width="3"/>
  <text x="474" y="326" text-anchor="middle" class="tiny">Lipo Rider</text>
  <rect x="487" y="472" width="116" height="66" rx="8" fill="#d9f0e7" stroke="#287b63" stroke-width="3"/>
  <text x="545" y="509" text-anchor="middle" class="tiny">DESPI-C02</text>
  <rect x="336" y="562" width="258" height="171" rx="9" fill="#fff1c9" stroke="#b07400" stroke-width="3"/>
  <text x="465" y="720" text-anchor="middle" class="tiny">电池投影 94×62 mm</text>

  <!-- magnets: large center (0,-52), central small (-10.5,14), upper small (47,60) -->
  <rect x="341" y="582" width="248" height="138" rx="9" fill="#e7aa3e" fill-opacity="0.88" stroke="#7c4d00" stroke-width="4"/>
  <text x="465" y="640" text-anchor="middle" class="label">90×50×2 mm</text>
  <text x="465" y="669" text-anchor="middle" class="tiny">横放｜中心 X≈0，Y≈−52</text>

  <rect x="409" y="401" width="55" height="138" rx="8" fill="#e7aa3e" fill-opacity="0.92" stroke="#7c4d00" stroke-width="4"/>
  <text x="437" y="470" text-anchor="middle" class="tiny" transform="rotate(-90 437 470)">50×20×2</text>
  <text x="389" y="557" class="tiny">中央：X≈−10.5，Y≈14</text>

  <rect x="572" y="274" width="55" height="138" rx="8" fill="#e7aa3e" fill-opacity="0.92" stroke="#7c4d00" stroke-width="4"/>
  <text x="600" y="344" text-anchor="middle" class="tiny" transform="rotate(-90 600 344)">50×20×2</text>
  <text x="650" y="335" class="tiny">右上安全带</text>
  <text x="650" y="359" class="tiny">X≈47，Y≈60</text>

  <!-- lower screw-post indicators -->
  <circle cx="358" cy="750" r="8" fill="#ffffff" stroke="#b63d34" stroke-width="3"/>
  <circle cx="567" cy="750" r="8" fill="#ffffff" stroke="#b63d34" stroke-width="3"/>
  <text x="462" y="787" text-anchor="middle" class="tiny">下方磁铁座与两颗螺丝柱之间保留塑料连接区</text>

  <!-- Callouts -->
  <line x1="341" y1="555" x2="589" y2="555" stroke="#c13f35" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="465" y="542" text-anchor="middle" class="tiny">90 mm</text>
  <line x1="285" y1="582" x2="285" y2="720" stroke="#c13f35" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="272" y="654" text-anchor="middle" class="tiny" transform="rotate(-90 272 654)">50 mm</text>

  <rect x="78" y="815" width="834" height="52" rx="14" fill="#e9f3ed"/>
  <text x="100" y="848" class="label">总磁面：6500 mm²，约为当前 9 条磁铁方案的 2.11 倍（增加约 111%）</text>

  <!-- Right notes -->
  <rect x="985" y="140" width="470" height="420" rx="28" fill="#ffffff" stroke="#c9d5d1" stroke-width="3"/>
  <text x="1018" y="187" class="section">排布逻辑</text>
  <text x="1018" y="232" class="label">① 结构上可行，但风险高于原排布</text>
  <text x="1018" y="263" class="small">中央磁铁与 ESP32、Lipo、DESPI、电池投影</text>
  <text x="1018" y="289" class="small">均不重叠；扣除 0.8 mm 槽壁后约留 7 mm。</text>
  <text x="1018" y="334" class="label">② 中央位置建议 X≈−10.5、Y≈14</text>
  <text x="1018" y="365" class="small">这是箭头区域中四周余量较均衡的位置，</text>
  <text x="1018" y="391" class="small">但会占用原来的中央线束通道，需要重新走线。</text>
  <text x="1018" y="436" class="label">③ 大磁铁恢复 X=0，右上磁铁不动</text>
  <text x="1018" y="467" class="small">大磁铁不再需要左移；右上磁铁继续远离</text>
  <text x="1018" y="493" class="small">ESP32 天线，整体磁面仍为 6500 mm²。</text>

  <!-- Section -->
  <rect x="985" y="590" width="470" height="300" rx="28" fill="#ffffff" stroke="#c9d5d1" stroke-width="3"/>
  <text x="1018" y="637" class="section">磁铁槽剖面</text>
  <rect x="1040" y="680" width="235" height="18" fill="#b9ccc3" stroke="#173b33" stroke-width="2"/>
  <rect x="1040" y="698" width="235" height="84" fill="#e7aa3e" stroke="#7c4d00" stroke-width="3"/>
  <rect x="1040" y="782" width="235" height="16" fill="#eef1ef" stroke="#879993" stroke-width="1"/>
  <text x="1300" y="696" class="small">装配/胶层余量 0.2 mm</text>
  <text x="1300" y="744" class="small">磁铁厚度 2.0 mm</text>
  <text x="1300" y="797" class="small">外侧 PETG 0.4 mm</text>
  <text x="1018" y="835" class="small">局部磁铁座总高约 2.6 mm。</text>
  <text x="1018" y="862" class="small">0.4 mm 为 0.4 喷嘴/0.20 层高的两层外皮，</text>
  <text x="1018" y="886" class="small">不建议继续减薄。</text>

  <rect x="45" y="930" width="1410" height="78" rx="20" fill="#fff4d7" stroke="#d7a53c" stroke-width="2"/>
  <text x="75" y="963" class="label">结论：尺寸上可以放置；正式改 STL 前建议先把小磁铁临时贴在旧后盖对应位置，完成 Wi-Fi 和刷新测试。</text>
  <text x="75" y="992" class="small">建议至少连续刷新 5 次，并确认线束可以绕开中央磁铁座；示意图不代表已经通过电磁兼容和实物承重测试。</text>
</svg>
